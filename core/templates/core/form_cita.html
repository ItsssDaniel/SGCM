<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SGCM - Agendar Cita</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-lg bg-white rounded-lg shadow-md p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Agendar Cita Médica</h2>
        
        <!-- Entregable 4: Mostrar error de empalme -->
        {% if error %}
        <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6" role="alert">
            <p class="font-bold">Cita rechazada</p>
            <p>{{ error }}</p>
        </div>
        {% endif %}

        <form method="POST" action="">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Paciente</label>
                <select name="paciente" required class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500">
                    <option value="">Seleccione un paciente...</option>
                    {% for p in pacientes %}
                        <option value="{{ p.id }}">{{ p.username }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Médico</label>
                <select name="medico" required class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500">
                    <option value="">Seleccione un médico...</option>
                    {% for m in medicos %}
                        <option value="{{ m.id }}">{{ m.username }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Consultorio</label>
                <select name="consultorio" required class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500">
                    <option value="">Seleccione un consultorio...</option>
                    {% for c in consultorios %}
                        <option value="{{ c.id }}">{{ c.nombre_consultorio }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex gap-4 mb-4">
                <div class="w-1/2">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Fecha</label>
                    <input type="date" name="fecha" required class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500">
                </div>
                <div class="w-1/2">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Hora</label>
                    <input type="time" name="hora" required class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Motivo de la consulta</label>
                <input type="text" name="motivo" required class="w-full px-3 py-2 border rounded focus:outline-none focus:border-blue-500">
            </div>
            
            <div class="flex justify-end gap-2">
                <a href="{% url 'lista_pacientes' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">Cancelar</a>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Agendar Cita</button>
            </div>
        </form>
    </div>
</body>
</html>
