{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGCM - Iniciar Sesión</title>
    
    <!-- Íconos de FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Tu hoja de estilos personalizada -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    
    <div class="login-card">
        
        <!-- Panel Izquierdo: Branding -->
        <div class="login-brand">
            <i class="fa-solid fa-staff-snake"></i>
            <h2>Sistema de Gestión de Consultorio Médico</h2>
            <p>Optimiza tus consultas, gestiona expedientes y mejora la atención a tus pacientes.</p>
        </div>

        <!-- Panel Derecho: Formulario -->
        <div class="login-form-container">
            <h3>¡Bienvenido de vuelta!</h3>
            <p class="subtitle">Por favor, ingresa tus credenciales para continuar.</p>
            
            <form action="#" method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input id="username" type="text" placeholder="ej. daniel_med">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" type="password" placeholder="••••••••">
                </div>
                
                <div class="form-actions">
                    <label>
                        <input type="checkbox"> Recordarme
                    </label>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button class="btn-submit" type="submit">Iniciar Sesión</button>
            </form>
        </div>
    </div>

</body>
</html>
